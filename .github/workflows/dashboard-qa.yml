name: Dashboard QA
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate dashboard code and data
        run: node scripts/qa-dashboard.mjs
